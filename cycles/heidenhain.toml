absolute_from_surface = ["CLEARANCE", "DEPTH", "SAFE"]
# TODO(question): heidenhain 5 gives Q239 as the pitch of cycle 207 only; PITCH of cycle 209 and its chip breaking (Q256, Q257) are not mapped (D178).

[[cycle]]
name = "CENTERING"
native = 240
params = { CLEARANCE = "Q200", DEPTH = "Q201", CYCLE_F = "Q206", SURFACE = "Q203", SAFE = "Q204", CYCLE_DWELL = "Q211" }
