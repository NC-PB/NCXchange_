absolute_from_surface = ["CLEARANCE", "DEPTH", "SAFE"]
# TODO(question): heidenhain 5 gives Q206 as the feed and Q207 as the tapping feed without naming the cycle; CYCLE_F of cycle 206 is not mapped (D178).

[[cycle]]
name = "BORE_MILL"
native = 208
params = { CLEARANCE = "Q200", DEPTH = "Q201", CYCLE_F = "Q206", SURFACE = "Q203", SAFE = "Q204" }
