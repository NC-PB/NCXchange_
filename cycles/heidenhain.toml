# RECT_POCKET is the entry of machine-config 6, completed by SAFE = Q204; the others map the same Q parameters of heidenhain 5.
# TODO(question): the own dimensions of 252 to 257 (diameters, slot length and width, stud sizes), the Q215 of 251 (language 4.7.1) and the allowances and
